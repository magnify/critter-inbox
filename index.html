<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Critter Inbox</title>
<style>
  /* ---- Tokens ---- */
  :root {
    /* Colour: ground/surface/line, ink scale, one accent, alert/ok + soft tints */
    --ground: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #edeff2;
    --line: #e1e4e9;

    --ink-1: #1a1d24;
    --ink-2: #5b6270;
    --ink-3: #9aa0ac;

    --accent: #3457d9;
    --accent-hover: #2a46b8;
    --accent-soft: #eaf0fd;

    --alert: #d0342c;
    --alert-soft: #fbeae9;

    --ok: #2e7d32;
    --ok-soft: #e8f5e9;

    /* Dataviz pair, kept separate from the UI accent: validated for colour-vision
       deficiency separation (see CREW_LOG). --ok doubles as the "AI" series. */
    --chart-ai: #4f8a3f;
    --chart-you: #4a7fc1;

    /* Type: five sizes for interface text, two for the numbers that are the product */
    --text-xs: 12px;
    --text-sm: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-xl: 20px;
    --text-display: 28px;
    --text-display-lg: 64px;
    --text-hero: clamp(88px, 10vw, 128px);

    /* Spacing: 4px base */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* Radius: one for controls, one for surfaces. --radius-tail is the single
       named exception, for the chat-bubble tail corner only. */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-tail: 4px;

    /* Control heights: one regular, one compact — both clear a 35px phone tap target */
    --control-h: 36px;
    --control-h-compact: 28px;

    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    font-size: var(--text-md);
    line-height: 1.45;
    background: var(--ground);
    color: var(--ink-1);
    height: 100vh; height: 100dvh;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .icon { display: inline-block; flex-shrink: 0; vertical-align: middle; }

  /* ---- Layout ---- */
  .app { display: flex; height: 100%; }
  .sidebar { width: 380px; min-width: 380px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; flex-direction: column; background: var(--ground); }
  .back-btn { display: none; }

  /* ---- Buttons: primary, quiet (btn-outline), danger — one regular size, one compact ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: var(--control-h); padding: 0 var(--space-4);
    border-radius: var(--radius-sm); border: 1px solid transparent;
    font: inherit; font-size: var(--text-sm); font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-compact { height: var(--control-h-compact); padding: 0 var(--space-3); font-size: var(--text-xs); }
  .btn-primary, .btn-success { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover, .btn-success:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-outline { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
  .btn-outline:hover { background: var(--surface-2); color: var(--ink-1); }
  .btn-danger { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
  .btn-danger:hover { background: var(--alert-soft); border-color: var(--alert-soft); color: var(--alert); }
  .back-btn { width: var(--control-h); padding: 0; }

  /* ---- Sidebar header / hero: the number is the only display-weight thing here ---- */
  .sidebar-header { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--line); }
  .hero { display: flex; flex-direction: column; align-items: flex-start; }
  .hero strong { font-size: var(--text-display-lg); line-height: 0.95; font-weight: 800; letter-spacing: -0.04em; margin-left: -0.04em; font-variant-numeric: tabular-nums; color: var(--alert); }
  .hero strong.zero { color: var(--ok); }
  .hero span { font-size: var(--text-lg); font-weight: 600; color: var(--ink-1); margin-top: var(--space-1); }
  .hero-sub { font-size: var(--text-sm); color: var(--ink-2); margin-top: var(--space-1); }

  /* ---- Filters: quiet underline tabs, not pills ---- */
  .filters { display: flex; gap: var(--space-4); padding: 0 var(--space-5); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filter-btn {
    position: relative; margin-bottom: -1px;
    padding: var(--space-3) 0; border: none; border-bottom: 2px solid transparent;
    background: none; font: inherit; font-size: var(--text-sm); font-weight: 600;
    color: var(--ink-2); cursor: pointer;
  }
  .filter-btn:hover { color: var(--ink-1); }
  .filter-btn.active { color: var(--ink-1); border-bottom-color: var(--accent); }
  .filter-btn .count { margin-left: 4px; font-size: var(--text-xs); color: var(--ink-3); }
  .filter-btn.active .count { color: var(--ink-2); }

  /* ---- Queue ---- */
  .conversation-list { flex: 1; overflow-y: auto; }
  .group-head, .card h2 {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin: 0;
  }
  .group-head { padding: var(--space-4) var(--space-5) var(--space-2); background: var(--surface); position: sticky; top: 0; z-index: 1; }
  .group-head .bulk { display: flex; gap: var(--space-2); align-items: center; }
  .group-empty { padding: var(--space-6) var(--space-5); text-align: center; color: var(--ink-2); font-size: var(--text-sm); }
  .group-empty strong { display: block; font-size: var(--text-lg); color: var(--ink-1); margin-bottom: var(--space-1); font-weight: 600; }

  .conversation-item { display: flex; align-items: flex-start; padding: var(--space-3) var(--space-5); cursor: pointer; border-bottom: 1px solid var(--line); transition: background 0.1s; position: relative; }
  .conversation-item:hover { background: var(--surface-2); }
  .conversation-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .conversation-item.selected { background: var(--accent-soft); }
  .conversation-item.resolved, .conversation-item.spam { opacity: 0.55; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-weight: 600; font-size: var(--text-sm); flex-shrink: 0; }
  .conv-info { flex: 1; margin-left: var(--space-3); min-width: 0; }
  .conv-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .conv-name { font-weight: 600; font-size: var(--text-md); color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-meta { font-size: var(--text-xs); color: var(--ink-3); white-space: nowrap; }
  .conv-preview { font-size: var(--text-sm); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-preview.draft::before { content: "Svar: "; color: var(--ink-3); }
  .conv-preview.flag { display: inline-block; margin-top: var(--space-1); padding: 1px var(--space-2); font-size: var(--text-xs); font-weight: 600; color: var(--alert); background: var(--alert-soft); border-radius: var(--radius-sm); white-space: nowrap; }
  .conv-actions { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
  .unread-dot { width: var(--space-2); height: var(--space-2); border-radius: 50%; background: var(--ink-3); position: absolute; top: 20px; left: 8px; }
  .conversation-item.attention .unread-dot { background: var(--alert); }

  /* ---- Main panel ---- */
  .main-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-size: var(--text-lg); font-weight: 400; flex-direction: column; gap: var(--space-3); }
  .main-empty .icon { color: var(--ink-3); }

  .chat-panel { flex: 1; display: flex; flex-direction: column; }
  .chat-header { padding: var(--space-4) var(--space-6); background: transparent; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .chat-header-left { display: flex; align-items: center; gap: var(--space-3); }
  .chat-header-name { font-weight: 600; font-size: var(--text-lg); }
  .chat-header-status { font-size: var(--text-sm); color: var(--ink-2); }
  .chat-header-actions { display: flex; gap: var(--space-2); }

  /* ---- Messages ---- */
  .messages { flex: 1; overflow-y: auto; padding: var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); }
  .message { max-width: 70%; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); font-size: var(--text-md); line-height: 1.4; position: relative; }
  .message.customer { align-self: flex-start; background: var(--surface-2); color: var(--ink-1); border-bottom-left-radius: var(--radius-tail); }
  .message.shop { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: var(--radius-tail); }
  .message .time { font-size: var(--text-xs); opacity: 0.65; margin-top: var(--space-1); }
  .message.shop .time { text-align: right; }
  .date-divider { text-align: center; font-size: var(--text-xs); color: var(--ink-3); padding: var(--space-2) 0; align-self: center; }

  /* ---- AI draft box: same surface language as .card, colour lives in a left stripe ---- */
  .ai-draft-box { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: var(--radius-md); margin: 0 var(--space-6) var(--space-4); padding: var(--space-4); }
  .ai-draft-box.attention { border-left-color: var(--alert); }
  .ai-draft-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
  .ai-draft-label { font-weight: 600; font-size: var(--text-sm); color: var(--ink-1); }
  .ai-confidence { font-size: var(--text-xs); color: var(--ink-2); background: var(--surface-2); padding: 2px var(--space-2); border-radius: var(--radius-sm); }
  .ai-draft-text { font-size: var(--text-md); line-height: 1.5; color: var(--ink-1); padding: var(--space-3); background: var(--surface-2); border-radius: var(--radius-sm); margin-bottom: var(--space-3); }
  .ai-draft-textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-3); font-size: var(--text-md); font-family: inherit; resize: vertical; display: none; }
  .ai-draft-box.editing .ai-draft-textarea { display: block; }
  .ai-draft-box.editing .ai-draft-text { display: none; }
  .ai-draft-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .ai-draft-note { font-size: var(--text-sm); color: var(--ink-2); }

  /* ---- Input area ---- */
  .chat-input { padding: var(--space-3) var(--space-6) var(--space-4); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: var(--space-2); align-items: flex-end; }
  .chat-input textarea { flex: 1; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-size: var(--text-md); font-family: inherit; resize: none; max-height: 100px; outline: none; }
  .chat-input textarea:focus { border-color: var(--accent); }

  /* ---- Toast: the one place that floats, so the one place that gets a shadow ---- */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink-1); color: #fff; padding: var(--space-3) var(--space-5); border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: transform 0.3s ease; z-index: 1000; display: flex; align-items: center; gap: var(--space-2); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast .check { color: #fff; }

  /* ---- Scrollbar ---- */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c4c4c4; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #999; }

  /* ---- Top bar + views ---- */
  .topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-5); gap: var(--space-3); }
  .nav { display: flex; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: var(--radius-sm); }
  .nav button { border: none; background: transparent; padding: var(--space-2) var(--space-4); border-radius: calc(var(--radius-sm) - 2px); font: inherit; font-size: var(--text-sm); font-weight: 600; color: var(--ink-2); cursor: pointer; }
  .nav button.active { background: var(--surface); color: var(--ink-1); }
  .nav button .pill { margin-left: var(--space-2); background: var(--alert); color: #fff; font-size: var(--text-xs); font-weight: 600; padding: 1px 7px; border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; }
  .view { height: calc(100% - 56px); }
  .view[hidden] { display: none; }
  .app { height: 100%; }

  /* ---- Overview: the needs-you number owns the page; the rest steps down ---- */
  .overview { overflow-y: auto; padding: var(--space-6) var(--space-6) var(--space-8); }
  .ov-inner { max-width: 1080px; margin: 0 auto; display: grid; gap: var(--space-8); grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); grid-template-areas: "tiles list" "chart chart"; align-items: start; }
  .tiles { grid-area: tiles; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5) var(--space-4); }
  .tile { position: relative; background: none; border: none; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .tile.static { cursor: default; }
  .tile .num { font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink-1); }
  .tile.attention { grid-column: 1 / -1; padding-bottom: var(--space-5); border-bottom: 1px solid var(--line); }
  .tile.attention .num { font-size: var(--text-hero); line-height: 0.95; letter-spacing: -0.04em; margin-left: -0.04em; color: var(--alert); }
  .tile.attention.zero .num { color: var(--ok); }
  .tile.attention .label { font-size: var(--text-xl); font-weight: 600; color: var(--ink-1); margin-top: var(--space-2); }
  .tile.attention .sub { font-size: var(--text-md); color: var(--ink-2); max-width: 36ch; }
  .tile:not(.attention) .num { font-size: var(--text-display); }
  .tile.drafted .num { color: var(--ok); }
  .tile:not(.attention) .label { font-size: var(--text-sm); font-weight: 600; color: var(--ink-2); }
  .tile:not(.attention) .sub { display: none; }
  .tile:not(.static) .label::after { content: " \203A"; color: var(--ink-3); }
  .tile:not(.static):hover .label { color: var(--accent); }
  .tile:not(.static):hover .label::after { color: var(--accent); }
  .card { padding: 0; }
  .card h2 { padding-bottom: var(--space-2); border-bottom: 1px solid var(--line); margin-bottom: var(--space-2); }
  .card h2 a { text-transform: none; letter-spacing: 0; font-size: var(--text-sm); font-weight: 600; color: var(--accent); cursor: pointer; }
  .card h2 .note { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); }
  .ov-inner > .card:first-of-type { grid-area: list; }
  .ov-inner > .card:last-of-type { grid-area: chart; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-5) var(--space-6) var(--space-6); }
  .ov-list .conversation-item { padding-left: 14px; padding-right: 0; }
  .ov-list .conversation-item:last-child { border-bottom: none; }
  .ov-empty { padding: var(--space-5) 0; color: var(--ink-2); font-size: var(--text-sm); }
  .ov-empty strong { display: block; color: var(--ink-1); font-size: var(--text-lg); font-weight: 600; margin-bottom: 2px; }

  /* ---- Week chart: validated green/blue pair, see CREW_LOG ---- */
  .chart { display: flex; gap: var(--space-2); align-items: flex-end; height: 160px; padding-top: var(--space-4); }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: var(--space-1); position: relative; }
  .chart .stack { width: 100%; max-width: 44px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; flex: 1; }
  .chart .seg { width: 100%; border-radius: 2px; }
  .chart .seg.ai { background: var(--chart-ai); border-radius: 4px 4px 2px 2px; }
  .chart .seg.you { background: var(--chart-you); }
  .chart .total { font-size: var(--text-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chart .day { font-size: var(--text-xs); color: var(--ink-3); }
  .chart .col.today .day { color: var(--ink-1); font-weight: 600; }
  .legend { display: flex; gap: var(--space-4); margin-top: var(--space-3); font-size: var(--text-xs); color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: var(--space-1); vertical-align: -1px; }
  .legend .ai::before { background: var(--chart-ai); }
  .legend .you::before { background: var(--chart-you); }
  .split { display: flex; gap: var(--space-3); font-size: var(--text-xs); color: var(--ink-2); }
  .split b { color: var(--ink-1); }

  @media (max-width: 960px) {
    .ov-inner { grid-template-columns: minmax(0, 1fr); grid-template-areas: "tiles" "list" "chart"; gap: var(--space-6); }
  }

  /* ---- Mobile: sidebar/panel swap at 768px, 35px+ tap targets ---- */
  @media (max-width: 768px) {
    .app { display: block; }
    .topbar { padding: 0 var(--space-3); }
    .topbar .brand span { display: none; }
    .nav button { padding: var(--space-3) var(--space-4); }
    .overview { padding: var(--space-4) var(--space-4) var(--space-8); }
    .ov-inner { grid-template-columns: minmax(0, 1fr); grid-template-areas: "tiles" "list" "chart"; gap: var(--space-6); }
    .tiles { gap: var(--space-4) var(--space-3); }
    .tile.attention { padding-bottom: var(--space-4); }
    .tile.attention .num { font-size: 96px; }
    .tile:not(.attention) .num { font-size: 24px; }
    .split { flex-wrap: wrap; gap: var(--space-1) var(--space-2); }
    .ov-inner > .card:last-of-type { padding: var(--space-4); }
    .hero strong { font-size: 56px; }
    .chart { height: 120px; }
    .sidebar { width: 100%; min-width: 0; height: 100%; }
    .main { display: none; height: 100%; width: 100%; }
    body.conv-open .sidebar { display: none; }
    body.conv-open .main { display: flex; }
    .back-btn { display: inline-flex; }
    .chat-header { padding: var(--space-3); }
    .messages { padding: var(--space-4) var(--space-3); }
    .ai-draft-box { margin: 0 var(--space-3) var(--space-3); }
    .chat-input { padding: var(--space-3) var(--space-3) var(--space-4); }
    .chat-input textarea { font-size: 16px; }
    .message { max-width: 85%; }
    .filters { padding: 0 var(--space-3); }
    .filter-btn { padding: var(--space-3) 2px; }
    .conversation-item { padding: var(--space-4) var(--space-3); }
    .ov-list .conversation-item { padding-left: var(--space-3); }
    .group-head { padding: var(--space-3) var(--space-3) var(--space-2); }
    .btn-compact { height: var(--control-h); padding: 0 var(--space-3); font-size: var(--text-sm); }
    .sidebar-header { padding: var(--space-3); }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Critter Inbox</div>
  <nav class="nav" id="nav">
    <button data-view="overview" class="active">Overblik</button>
    <button data-view="inbox">Indbakke <span class="pill" id="nav-pill" hidden></span></button>
  </nav>
</header>

<section class="view overview" id="view-overview">
  <div class="ov-inner">
    <div class="tiles">
      <button class="tile attention" onclick="goInbox('attention')">
        <div class="num" id="ov-attention">0</div>
        <div class="label">Kræver dig</div>
        <div class="sub" id="ov-attention-sub"></div>
      </button>
      <button class="tile drafted" onclick="goInbox('drafted')">
        <div class="num" id="ov-drafted">0</div>
        <div class="label">Klar til at sende</div>
        <div class="sub">Svar som AI har skrevet. Tjek dem, eller send dem alle.</div>
      </button>
      <div class="tile static">
        <div class="num" id="ov-today">0</div>
        <div class="label">Sendt i dag</div>
        <div class="split"><span><b id="ov-today-ai">0</b> af AI</span><span><b id="ov-today-you">0</b> af dig</span></div>
      </div>
      <div class="tile static">
        <div class="num" id="ov-open">0</div>
        <div class="label">Åbne samtaler</div>
        <div class="split" id="ov-sources"></div>
      </div>
    </div>

    <div class="card">
      <h2><span>Kræver dig nu</span><a onclick="goInbox('attention')">Åbn indbakke</a></h2>
      <div class="ov-list" id="ov-list"></div>
    </div>

    <div class="card">
      <h2><span>Denne uge</span><span class="note">Svar sendt pr. dag</span></h2>
      <div class="chart" id="chart"></div>
      <div class="legend"><span class="ai">Sendt af AI, godkendt af dig</span><span class="you">Skrevet af dig</span></div>
    </div>
  </div>
</section>

<section class="view" id="view-inbox" hidden>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="hero"><strong id="hero-count">0</strong><span id="hero-label">kræver dig</span></div>
      <div class="hero-sub" id="hero-sub"></div>
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Alle</button>
      <button class="filter-btn" data-filter="attention">Kræver dig <span class="count" id="count-attention"></span></button>
      <button class="filter-btn" data-filter="drafted">Klar til at sende <span class="count" id="count-drafted"></span></button>
      <button class="filter-btn" data-filter="done">Afsluttet <span class="count" id="count-done"></span></button>
    </div>
    <div class="conversation-list" id="conversation-list"></div>
  </div>

  <!-- Main panel -->
  <div class="main" id="main-panel">
    <div class="main-empty" id="empty-state">
      <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
      <div>Vælg en samtale for at komme i gang</div>
    </div>
  </div>
</div>

</section>

<!-- Toast -->
<div class="toast" id="toast"><span class="check"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l4.5 4.5L20 6"/></svg></span> <span id="toast-text">Svar sendt</span></div>

<script>
// Sample data for a fictional Danish gecko shop. Every name, message and price is invented.
const conversations = [
  {
    id: 1, name: "Mette H.", avatar: "M", color: "orange", minutesAgo: 4, source: "messenger",
    status: "attention", unread: true,
    messages: [
      { from: "customer", text: "Hej! Min kronegekko har ikke spist i snart en uge. Er det normalt, eller skal jeg være bekymret?", time: "09.14" },
      { from: "customer", text: "Hun sidder også bare helt stille i det fugtige hjørne af terrariet hele tiden.", time: "09.15" },
    ],
    aiDraft: null, holdReason: "health"
  },
  {
    id: 2, name: "Jonas P.", avatar: "J", color: "green", minutesAgo: 9, source: "messenger",
    status: "drafted", unread: false,
    messages: [
      { from: "customer", text: "Hej! Har du stadig chahouaer til salg fra sidste kuld? Leder efter en han.", time: "08.51" },
    ],
    aiDraft: "Hej Jonas! Ja, der er stadig et par tilbage fra kuldet 🦎 Vi kigger på hanner/hunner og vender tilbage med billeder og pris i løbet af dagen.",
    confidence: 87
  },
  {
    id: 3, name: "Camilla S.", avatar: "C", color: "purple", minutesAgo: 17, source: "messenger",
    status: "drafted", unread: false,
    messages: [
      { from: "customer", text: "Hvad skal der til for et bioaktivt terrarium til en leachianus? Og sælger I bænkebidere til det?", time: "08.20" },
    ],
    aiDraft: "Hej Camilla! Til en leachianus vil vi anbefale et terrarium på mindst 45x45x60 cm med god højde, fugtig bund og masser af klatremuligheder. Vi har bænkebidere til bioaktive opsætninger — en bakke koster 75 kr. Sig til, hvor mange du skal bruge, så pakker vi dem klar.",
    confidence: 80
  },
  {
    id: 4, name: "Thomas K.", avatar: "T", color: "teal", minutesAgo: 33, source: "messenger",
    status: "drafted", unread: false,
    messages: [
      { from: "customer", text: "Har I åbent i weekenden, eller er det kun til messer man kan møde jer?", time: "07.58" },
    ],
    aiDraft: "Hej Thomas! Vi har ikke en fast butik, men skriv endelig, så finder vi en tid til afhentning, der passer 🦎",
    confidence: 93
  },
  {
    id: 5, name: "Sofie L.", avatar: "S", color: "orange", minutesAgo: 61, source: "messenger",
    status: "attention", unread: true,
    messages: [
      { from: "customer", text: "Min daggekko har fastsiddende hud om tæerne efter skiftning. Er det farligt, eller går det væk af sig selv?", time: "07.02" },
      { from: "customer", text: "Hun prøver selv at gnave i det, men det ser ikke ud til at rykke sig.", time: "07.03" },
    ],
    aiDraft: null, holdReason: "health"
  },
  {
    id: 6, name: "Nikolaj B.", avatar: "N", color: "green", minutesAgo: 92, source: "messenger",
    status: "drafted", unread: false,
    messages: [
      { from: "customer", text: "Kan I reservere en af gargoyle-ungerne fra det nye kuld til mig? Den med de orange striber på billedet.", time: "06.32" },
    ],
    aiDraft: "Hej Nikolaj! Vi kan sagtens reservere den til dig. Vi bekræfter pris og hvor længe vi kan holde den af.",
    confidence: 85
  },
  {
    id: 7, name: "GevinstKlubben99", avatar: "G", color: "red", minutesAgo: 125, source: "messenger",
    status: "spam", unread: false,
    messages: [
      { from: "customer", text: "🔥🔥🔥 Vind en gratis iPhone nu!! Klik her: www.helt-sikkert-ikke-svindel.biz 🔥🔥🔥", time: "05.10" },
    ],
    aiDraft: null
  },
  {
    id: 8, name: "Freja A.", avatar: "F", color: "purple", minutesAgo: 200, source: "messenger",
    status: "resolved", unread: false,
    messages: [
      { from: "customer", text: "Sælger I stadig Phelsuma-daggekkoer? Så et opslag fra messen i Aars.", time: "03.40" },
      { from: "shop", text: "Hej Freja! Ja, vi har et par styk tilbage. Skriv gerne hvilken art du kigger efter, så finder vi dem frem 🦎", time: "03.52" },
      { from: "customer", text: "Fedt, jeg er interesseret i klassisk grandis. Hvordan foregår afhentning?", time: "03.58" },
      { from: "shop", text: "Vi aftaler tid og sted, når vi alligevel er i nærheden — ellers sender vi med GLS. Skriver til dig, når vi har en dato.", time: "04.05" },
    ],
    aiDraft: null
  },
  {
    id: 9, name: "Anders V.", avatar: "A", color: "teal", minutesAgo: 260, source: "messenger",
    status: "attention", unread: true,
    messages: [
      { from: "customer", text: "Min kronegekkos hale virker helt slap og har mistet farve de sidste par dage. Kan det være mangel på kalk?", time: "01.10" },
      { from: "customer", text: "Han spiser stadig, men bevæger sig meget stille.", time: "01.11" },
    ],
    aiDraft: null, holdReason: "health"
  },
  {
    id: 10, name: "Ida M.", avatar: "I", color: "orange", minutesAgo: 310, source: "instagram",
    status: "drafted", unread: false,
    messages: [
      { from: "customer", text: "Hej! Fulgte jer fra Reptilmessen i Rødovre — sælger I stadig kronegekkoer, og hvad koster en unge cirka?", time: "00.05" },
    ],
    aiDraft: "Hej Ida! Ja, vi har kronegekkoer 🦎 Vi vender tilbage med pris og hvilke unger der er tilbage fra kuldet.",
    confidence: 82
  },
];

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function multiline(str) { return esc(str).replace(/\n/g, "<br>"); }

// Sample history for the week chart. Replace with real counts when a channel is wired.
const WEEK = [
  { day: "Ons", ai: 14, you: 5 },
  { day: "Tor", ai: 11, you: 4 },
  { day: "Fre", ai: 18, you: 6 },
  { day: "Lør", ai: 22, you: 3 },
  { day: "Søn", ai: 9, you: 2 },
  { day: "Man", ai: 16, you: 4 },
];
// Seeded from the sample: replies the shop already sent today.
const sentToday = { ai: 0, you: conversations.reduce((n, c) => n + c.messages.filter(m => m.from === "shop").length, 0) };

let view = "overview";
let activeFilter = "all";
let selectedConvId = null;
let confirmBulk = false;

const GROUPS = [
  { key: "attention", label: "Kræver dig", statuses: ["attention"] },
  { key: "drafted", label: "Klar til at sende", statuses: ["drafted"] },
  { key: "done", label: "Afsluttet", statuses: ["resolved", "spam"] },
];

function ago(mins) {
  if (mins < 60) return `${mins}m`;
  if (mins < 1440) return `${Math.round(mins / 60)}t`;
  return `${Math.round(mins / 1440)}d`;
}
const SOURCE_LABEL = { messenger: "Messenger", instagram: "Instagram", email: "E-mail" };
function statusLabel(status) {
  return { attention: "Kræver dig", drafted: "Klar til at sende", resolved: "Afsluttet", spam: "Spam" }[status];
}
function byRecency(a, b) { return a.minutesAgo - b.minutesAgo; }
function inGroup(c, g) { return g.statuses.includes(c.status); }
function drafted() { return conversations.filter(c => c.status === "drafted" && c.aiDraft); }

function updateCounts() {
  const attention = conversations.filter(c => c.status === "attention").length;
  const ready = drafted().length;
  const done = conversations.filter(c => c.status === "resolved" || c.status === "spam").length;
  const hero = document.getElementById("hero-count");
  hero.textContent = attention;
  hero.classList.toggle("zero", attention === 0);
  document.getElementById("hero-label").textContent = "kræver dig";
  document.getElementById("hero-sub").textContent =
    ready ? `${ready} ${ready === 1 ? "svar" : "svar"} klar til at sende. Ét tryk hver, eller send dem alle.` : "Intet venter på at blive sendt.";
  document.getElementById("count-attention").textContent = attention;
  document.getElementById("count-drafted").textContent = ready;
  document.getElementById("count-done").textContent = done;
  const pill = document.getElementById("nav-pill");
  pill.textContent = attention; pill.hidden = attention === 0;
  if (view === "overview") renderOverview();
}

function renderItem(c) {
  const last = c.messages[c.messages.length - 1];
  let preview;
  if (c.status === "drafted" && c.aiDraft) preview = `<div class="conv-preview draft">${esc(c.aiDraft)}</div>`;
  else if (c.status === "attention" && c.holdReason === "health") preview = `<div class="conv-preview flag">Muligt sundhedsproblem</div>`;
  else preview = "";
  const actions = c.status === "drafted" && c.aiDraft
    ? `<div class="conv-actions">
         <button class="btn btn-compact btn-success" onclick="event.stopPropagation(); sendDraft(${c.id}); afterSend()">Send</button>
         <button class="btn btn-compact btn-outline" onclick="event.stopPropagation(); selectConversation(${c.id})">Åbn</button>
       </div>`
    : "";
  return `
    <div class="conversation-item ${c.status} ${selectedConvId === c.id ? 'selected' : ''}"
         role="button" tabindex="0"
         onclick="selectConversation(${c.id})"
         onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectConversation(${c.id}); }">
      ${c.unread ? '<div class="unread-dot"></div>' : ''}
      <div class="avatar ${c.color}">${esc(c.avatar)}</div>
      <div class="conv-info">
        <div class="conv-top">
          <span class="conv-name">${esc(c.name)}</span>
          <span class="conv-meta">${esc(SOURCE_LABEL[c.source] || c.source)} · ${ago(c.minutesAgo)}</span>
        </div>
        <div class="conv-preview">${esc(last.from === "shop" ? "Dig: " + last.text : last.text)}</div>
        ${preview}
        ${actions}
      </div>
    </div>`;
}

function renderGroup(g, items) {
  let head = `<span>${g.label} · ${items.length}</span>`;
  if (g.key === "drafted" && items.length > 1) {
    head += confirmBulk
      ? `<span class="bulk">
           <button class="btn btn-compact btn-success" onclick="sendAllDrafts()">Send ${items.length} nu</button>
           <button class="btn btn-compact btn-outline" onclick="confirmBulk = false; renderConversationList()">Annullér</button>
         </span>`
      : `<button class="btn btn-compact btn-outline" onclick="confirmBulk = true; renderConversationList()">Send alle</button>`;
  }
  let body;
  if (items.length) body = items.map(renderItem).join("");
  else if (g.key === "attention") body = `<div class="group-empty"><strong>Ingenting kræver dig.</strong>Gå ud og pas dyrene.</div>`;
  else if (g.key === "drafted") body = `<div class="group-empty">Ingen svar venter.</div>`;
  else body = `<div class="group-empty">Intet afsluttet endnu.</div>`;
  return `<div class="group-head ${g.key}">${head}</div>${body}`;
}

function renderConversationList() {
  const list = document.getElementById("conversation-list");
  const groups = activeFilter === "all" ? GROUPS : GROUPS.filter(g => g.key === activeFilter);
  list.innerHTML = groups.map(g => {
    const items = conversations.filter(c => inGroup(c, g)).sort(byRecency);
    return renderGroup(g, items);
  }).join("");
}

function sendDraft(id, text) {
  const conv = conversations.find(c => c.id === id);
  const body = (text ?? conv.aiDraft ?? "").trim();
  if (!body) return;
  if (body === (conv.aiDraft || "").trim()) sentToday.ai++; else sentToday.you++;
  conv.messages.push({ from: "shop", text: body, time: "Lige nu" });
  conv.aiDraft = null;
  conv.status = "resolved";
  conv.unread = false;
}

function afterSend() {
  showToast("Svar sendt");
  if (selectedConvId) selectConversation(selectedConvId);
  updateCounts();
  renderConversationList();
}

function sendAllDrafts() {
  const ready = drafted();
  ready.forEach(c => sendDraft(c.id));
  confirmBulk = false;
  showToast(`${ready.length} svar sendt`);
  if (selectedConvId) selectConversation(selectedConvId);
  updateCounts();
  renderConversationList();
}

function selectConversation(id) {
  if (view !== "inbox") showView("inbox");
  selectedConvId = id;
  const conv = conversations.find(c => c.id === id);
  conv.unread = false;
  document.body.classList.add("conv-open");
  renderConversationList();
  renderChatPanel(conv);
}

function closeConversation() {
  document.body.classList.remove("conv-open");
  selectedConvId = null;
  renderConversationList();
}

function renderChatPanel(conv) {
  const main = document.getElementById("main-panel");
  const status = `${statusLabel(conv.status)} · ${esc(SOURCE_LABEL[conv.source] || conv.source)}`;

  let messagesHTML = conv.messages.map(m => `
    <div class="message ${m.from === 'shop' ? 'shop' : 'customer'}">
      ${multiline(m.text)}
      <div class="time">${esc(m.time)}</div>
    </div>
  `).join("");

  let aiDraftHTML = "";
  if (conv.aiDraft) {
    aiDraftHTML = `
      <div class="ai-draft-box">
        <div class="ai-draft-header">
          <div class="ai-draft-label">AI-forslag</div>
          <span class="ai-confidence">Sikkerhed: ${conv.confidence}%</span>
        </div>
        <div class="ai-draft-text" id="draft-display">${multiline(conv.aiDraft)}</div>
        <textarea class="ai-draft-textarea" id="draft-edit">${esc(conv.aiDraft)}</textarea>
        <div class="ai-draft-actions">
          <button class="btn btn-success" onclick="approveDraft(${conv.id})">Godkend og send</button>
          <button class="btn btn-outline" id="edit-btn" onclick="toggleEdit()">Rediger svar</button>
          <button class="btn btn-outline" onclick="resolveConversation(${conv.id})">Afslut</button>
          <button class="btn btn-danger" onclick="spamConversation(${conv.id})">Spam</button>
        </div>
      </div>
    `;
  } else if (conv.status === "attention") {
    const note = conv.holdReason === "health"
      ? "Det her ligner et sundhedsproblem, så der er ikke skrevet noget svarforslag. Svar selv nedenfor."
      : "Der er ikke skrevet noget svarforslag til den her. Svar selv nedenfor.";
    aiDraftHTML = `
      <div class="ai-draft-box attention">
        <div class="ai-draft-header">
          <div class="ai-draft-label">Kræver dit svar</div>
        </div>
        <div class="ai-draft-note">${note}</div>
      </div>
    `;
  }

  main.innerHTML = `
    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-left">
          <button class="btn btn-outline back-btn" onclick="closeConversation()" aria-label="Tilbage"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5L8 12l6.5 7"/></svg></button>
          <div class="avatar ${conv.color}">${esc(conv.avatar)}</div>
          <div>
            <div class="chat-header-name">${esc(conv.name)}</div>
            <div class="chat-header-status">${status}</div>
          </div>
        </div>
        <div class="chat-header-actions">
          ${conv.status === 'resolved' || conv.status === 'spam'
            ? `<button class="btn btn-outline" onclick="reopenConversation(${conv.id})">Genåbn</button>`
            : `<button class="btn btn-outline" onclick="resolveConversation(${conv.id})">Afslut</button>`}
        </div>
      </div>
      <div class="messages">
        <div class="date-divider">I dag</div>
        ${messagesHTML}
      </div>
      ${aiDraftHTML}
      <div class="chat-input">
        <textarea placeholder="Skriv et svar..." rows="1" id="manual-reply"></textarea>
        <button class="btn btn-primary" onclick="sendManualReply(${conv.id})">Send</button>
      </div>
    </div>
  `;
}

function approveDraft(id) {
  const textarea = document.getElementById("draft-edit");
  sendDraft(id, textarea ? textarea.value : undefined);
  afterSend();
}

function toggleEdit() {
  const conv = conversations.find(c => c.id === selectedConvId);
  const box = document.querySelector(".ai-draft-box");
  const display = document.getElementById("draft-display");
  const textarea = document.getElementById("draft-edit");
  const btn = document.getElementById("edit-btn");
  const editing = box.classList.toggle("editing");
  if (editing) {
    btn.textContent = "Færdig";
    btn.classList.add("btn-primary");
    btn.classList.remove("btn-outline");
    textarea.focus();
  } else {
    btn.textContent = "Rediger svar";
    btn.classList.remove("btn-primary");
    btn.classList.add("btn-outline");
    conv.aiDraft = textarea.value;
    display.innerHTML = multiline(textarea.value);
  }
}

function sendManualReply(id) {
  const textarea = document.getElementById("manual-reply");
  const text = textarea.value.trim();
  if (!text) return;
  const conv = conversations.find(c => c.id === id);
  sentToday.you++;
  conv.messages.push({ from: "shop", text: text, time: "Lige nu" });
  if (conv.status === "attention") {
    conv.status = "resolved";
  }
  showToast("Svar sendt");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function resolveConversation(id) {
  const conv = conversations.find(c => c.id === id);
  conv.status = "resolved";
  conv.aiDraft = null;
  showToast("Markeret som afsluttet");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function reopenConversation(id) {
  const conv = conversations.find(c => c.id === id);
  conv.status = "attention";
  showToast("Samtalen genåbnet");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function spamConversation(id) {
  const conv = conversations.find(c => c.id === id);
  conv.status = "spam";
  conv.aiDraft = null;
  showToast("Markeret som spam");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function showToast(text) {
  const toast = document.getElementById("toast");
  document.getElementById("toast-text").textContent = text;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}

// Overview
function renderOverview() {
  const attention = conversations.filter(c => c.status === "attention").sort(byRecency);
  const ready = drafted().length;
  const open = conversations.filter(c => c.status === "attention" || c.status === "drafted");
  const tile = document.querySelector(".tile.attention");
  tile.classList.toggle("zero", attention.length === 0);
  document.getElementById("ov-attention").textContent = attention.length;
  document.getElementById("ov-attention-sub").textContent = attention.length
    ? (attention.some(c => c.holdReason === "health") ? "Mindst én ligner et sundhedsproblem." : "Venter på svar fra dig.")
    : "Intet venter på dig.";
  document.getElementById("ov-drafted").textContent = ready;
  document.getElementById("ov-today").textContent = sentToday.ai + sentToday.you;
  document.getElementById("ov-today-ai").textContent = sentToday.ai;
  document.getElementById("ov-today-you").textContent = sentToday.you;
  document.getElementById("ov-open").textContent = open.length;
  const bySource = {};
  open.forEach(c => { bySource[c.source] = (bySource[c.source] || 0) + 1; });
  document.getElementById("ov-sources").innerHTML = Object.entries(bySource)
    .map(([k, n]) => `<span><b>${n}</b> ${esc(SOURCE_LABEL[k] || k)}</span>`).join("") || "<span>Ingen åbne</span>";

  document.getElementById("ov-list").innerHTML = attention.length
    ? attention.map(renderItem).join("")
    : `<div class="ov-empty"><strong>Ingenting kræver dig.</strong>Gå ud og pas dyrene.</div>`;

  const pill = document.getElementById("nav-pill");
  pill.textContent = attention.length;
  pill.hidden = attention.length === 0;

  const days = [...WEEK, { day: "I dag", ai: sentToday.ai, you: sentToday.you, today: true }];
  const max = Math.max(...days.map(d => d.ai + d.you), 1);
  document.getElementById("chart").innerHTML = days.map(d => `
    <div class="col ${d.today ? "today" : ""}" title="${esc(d.day)}: ${d.ai} af AI, ${d.you} af dig">
      <div class="total">${d.ai + d.you || ""}</div>
      <div class="stack">
        <div class="seg ai" style="height:${(d.ai / max) * 100}%"></div>
        <div class="seg you" style="height:${(d.you / max) * 100}%"></div>
      </div>
      <div class="day">${esc(d.day)}</div>
    </div>`).join("");
}

function showView(name) {
  view = name;
  document.getElementById("view-overview").hidden = name !== "overview";
  document.getElementById("view-inbox").hidden = name !== "inbox";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  if (name === "overview") renderOverview();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  renderConversationList();
}

function goInbox(filter) {
  setFilter(filter || "all");
  showView("inbox");
}

document.getElementById("nav").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (btn) showView(btn.dataset.view);
});

// Filters
document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (btn) setFilter(btn.dataset.filter);
});

// Init
updateCounts();
renderConversationList();
showView("overview");
</script>
</body>
</html>
