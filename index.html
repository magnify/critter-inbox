<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gekkoriget · Indbakke</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1c1e21; height: 100vh; height: 100dvh; overflow: hidden; }
  :root { --alert-red: #d32f2f; --ok-green: #2e7d32; }

  /* Layout */
  .app { display: flex; height: 100vh; height: 100dvh; }
  .sidebar { width: 380px; min-width: 380px; background: #fff; border-right: 1px solid #dddfe2; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; flex-direction: column; background: #f0f2f5; }
  .back-btn { display: none; }

  /* Header */
  .sidebar-header { padding: 16px 20px 14px; border-bottom: 1px solid #dddfe2; }
  .brand { font-size: 13px; font-weight: 600; color: #65676b; display: flex; align-items: center; gap: 6px; }
  .hero { margin-top: 8px; display: flex; align-items: baseline; gap: 10px; }
  .hero strong { font-size: 40px; line-height: 1; font-weight: 800; color: var(--alert-red); }
  .hero strong.zero { color: var(--ok-green); }
  .hero span { font-size: 16px; font-weight: 600; color: #1c1e21; }
  .hero-sub { font-size: 12px; color: #65676b; margin-top: 6px; }

  /* Filters */
  .filters { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid #e4e6eb; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; background: #e4e6eb; color: #65676b; transition: all 0.15s; }
  .filter-btn:hover { background: #d8dadf; }
  .filter-btn.active { background: #1c1e21; color: #fff; }
  .filter-btn .count { margin-left: 4px; font-size: 11px; opacity: 0.8; }

  /* Queue */
  .conversation-list { flex: 1; overflow-y: auto; }
  .group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 20px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #65676b; background: #fff; position: sticky; top: 0; z-index: 1; }
  .group-head.attention { color: #d32f2f; }
  .group-head.drafted { color: #2e7d32; }
  .group-head .btn, .conv-actions .btn { padding: 5px 12px; font-size: 12px; }
  .group-head .btn { text-transform: none; letter-spacing: 0; }
  .group-head .bulk { display: flex; gap: 6px; align-items: center; }
  .group-empty { padding: 28px 20px; text-align: center; color: #65676b; font-size: 14px; }
  .group-empty strong { display: block; font-size: 16px; color: #1c1e21; margin-bottom: 4px; }

  .conversation-item { display: flex; align-items: flex-start; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f0f2f5; transition: background 0.1s; position: relative; }
  .conversation-item:hover { background: #f0f2f5; }
  .conversation-item:focus-visible { outline: 2px solid #0084ff; outline-offset: -2px; }
  .conversation-item.selected { background: #e7f3ff; }
  .conversation-item.attention { border-left: 3px solid #d32f2f; padding-left: 17px; }
  .conversation-item.resolved, .conversation-item.spam { opacity: 0.55; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #0084ff; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .avatar.orange { background: #f7b928; }
  .avatar.green { background: #00c853; }
  .avatar.red { background: #ff5252; }
  .avatar.purple { background: #9c27b0; }
  .avatar.teal { background: #009688; }
  .conv-info { flex: 1; margin-left: 12px; min-width: 0; }
  .conv-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .conv-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-meta { font-size: 12px; color: #65676b; white-space: nowrap; }
  .conv-preview { font-size: 13px; color: #65676b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-preview.draft { color: #2e7d32; }
  .conv-preview.draft::before { content: "Svar: "; font-weight: 600; }
  .conv-preview.flag { color: #d32f2f; font-weight: 600; }
  .conv-actions { display: flex; gap: 6px; margin-top: 8px; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: #0084ff; position: absolute; top: 18px; left: 6px; }
  .conversation-item.attention .unread-dot { background: #d32f2f; }

  /* Main panel */
  .main-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #65676b; font-size: 18px; flex-direction: column; gap: 8px; }
  .main-empty .icon { font-size: 48px; opacity: 0.3; }

  .chat-panel { flex: 1; display: flex; flex-direction: column; }
  .chat-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #dddfe2; display: flex; align-items: center; justify-content: space-between; }
  .chat-header-left { display: flex; align-items: center; gap: 12px; }
  .chat-header-name { font-weight: 700; font-size: 16px; }
  .chat-header-status { font-size: 12px; color: #65676b; }
  .chat-header-actions { display: flex; gap: 8px; }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
  .message { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; position: relative; }
  .message.customer { align-self: flex-start; background: #e4e6eb; border-bottom-left-radius: 4px; }
  .message.shop { align-self: flex-end; background: #0084ff; color: #fff; border-bottom-right-radius: 4px; }
  .message .time { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  .message.shop .time { text-align: right; }
  .date-divider { text-align: center; font-size: 12px; color: #65676b; padding: 8px 0; align-self: center; }

  /* AI Draft box */
  .ai-draft-box { background: #fff; border-top: 2px solid #00c853; margin: 0 24px 16px; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .ai-draft-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .ai-draft-label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; color: #2e7d32; }
  .ai-draft-label .sparkle { font-size: 16px; }
  .ai-confidence { font-size: 12px; color: #65676b; background: #f0f2f5; padding: 2px 10px; border-radius: 10px; }
  .ai-draft-text { font-size: 14px; line-height: 1.5; color: #1c1e21; padding: 12px; background: #f8fdf8; border-radius: 8px; border: 1px solid #e8f5e9; margin-bottom: 12px; }
  .ai-draft-textarea { width: 100%; min-height: 80px; border: 1px solid #dddfe2; border-radius: 8px; padding: 12px; font-size: 14px; font-family: inherit; resize: vertical; display: none; }
  .ai-draft-box.editing .ai-draft-textarea { display: block; }
  .ai-draft-box.editing .ai-draft-text { display: none; }
  .ai-draft-actions { display: flex; gap: 8px; }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: #0084ff; color: #fff; }
  .btn-primary:hover { background: #0073e6; }
  .btn-success { background: #00c853; color: #fff; }
  .btn-success:hover { background: #00b248; }
  .btn-outline { background: #fff; color: #65676b; border: 1px solid #dddfe2; }
  .btn-outline:hover { background: #f0f2f5; }
  .btn-danger { background: #fff; color: #d32f2f; border: 1px solid #ffcdd2; }
  .btn-danger:hover { background: #ffebee; }

  /* Input area */
  .chat-input { padding: 12px 24px 16px; background: #fff; border-top: 1px solid #dddfe2; display: flex; gap: 8px; align-items: flex-end; }
  .chat-input textarea { flex: 1; border: 1px solid #dddfe2; border-radius: 20px; padding: 10px 16px; font-size: 14px; font-family: inherit; resize: none; max-height: 100px; outline: none; }
  .chat-input textarea:focus { border-color: #0084ff; }

  /* Toast */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1c1e21; color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: transform 0.3s ease; z-index: 1000; display: flex; align-items: center; gap: 8px; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast .check { color: #00c853; font-size: 18px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c4c4c4; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #999; }

  /* Badge */


  /* Top bar + views */
  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #dddfe2; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; }
  .topbar .brand { font-size: 15px; }
  .nav { display: flex; gap: 4px; background: #e4e6eb; padding: 3px; border-radius: 20px; }
  .nav button { border: none; background: transparent; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; color: #65676b; cursor: pointer; }
  .nav button.active { background: #1c1e21; color: #fff; }
  .nav button .pill { margin-left: 6px; background: #d32f2f; color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 10px; }
  .nav button.active .pill { background: #fff; color: #d32f2f; }
  .view { height: calc(100vh - 52px); height: calc(100dvh - 52px); }
  .view[hidden] { display: none; }
  .app { height: 100%; }

  /* Overview */
  .overview { overflow-y: auto; padding: 20px; }
  .ov-inner { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .tile { position: relative; background: #fff; border: 1px solid #dddfe2; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; font-family: inherit; cursor: pointer; }
  .tile:hover { border-color: #b0b3b8; }
  .tile:not(.static)::after { content: "→"; position: absolute; top: 14px; right: 14px; font-size: 14px; font-weight: 700; color: #0084ff; }
  .tile.static { cursor: default; }
  .tile.static:hover { border-color: #dddfe2; }
  .tile .num { font-size: 36px; font-weight: 800; line-height: 1; color: #1c1e21; }
  .tile.attention .num { color: var(--alert-red); }
  .tile.attention.zero .num { color: var(--ok-green); }
  .tile.drafted .num { color: var(--ok-green); }
  .tile .label { font-size: 14px; font-weight: 600; color: #1c1e21; }
  .tile .sub { font-size: 12px; color: #65676b; }
  .tile .btn { align-self: flex-start; margin-top: 4px; }
  .card { background: #fff; border: 1px solid #dddfe2; border-radius: 12px; padding: 16px 20px; }
  .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 a { font-size: 12px; font-weight: 600; color: #0084ff; cursor: pointer; }
  .card h2 .note { font-size: 11px; font-weight: 500; color: #65676b; }
  .ov-empty { padding: 20px 0; color: #65676b; font-size: 14px; }
  .ov-empty strong { display: block; color: #1c1e21; font-size: 16px; margin-bottom: 2px; }

  /* Week chart */
  .chart { display: flex; gap: 8px; align-items: flex-end; height: 140px; padding-top: 18px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; position: relative; }
  .chart .stack { width: 100%; max-width: 44px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; flex: 1; }
  .chart .seg { width: 100%; border-radius: 2px; }
  .chart .seg.ai { background: #2e7d32; border-radius: 4px 4px 2px 2px; }
  .chart .seg.you { background: #0084ff; }
  .chart .total { font-size: 11px; color: #65676b; font-weight: 600; }
  .chart .day { font-size: 11px; color: #65676b; }
  .chart .col.today .day { color: #1c1e21; font-weight: 700; }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: #65676b; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend .ai::before { background: #2e7d32; }
  .legend .you::before { background: #0084ff; }
  .split { display: flex; gap: 14px; font-size: 12px; color: #65676b; }
  .split b { color: #1c1e21; }

  /* Mobile */
  @media (max-width: 768px) {
    .app { display: block; }
    .topbar { padding: 0 12px; }
    .topbar .brand span { display: none; }
    .nav button { padding: 10px 14px; }
    .overview { padding: 12px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tile { padding: 12px; }
    .tile .num { font-size: 30px; }
    .chart { height: 120px; }
    .sidebar { width: 100%; min-width: 0; height: 100%; }
    .main { display: none; height: 100%; width: 100%; }
    body.conv-open .sidebar { display: none; }
    body.conv-open .main { display: flex; }
    .back-btn { display: inline-flex; }
    .chat-header { padding: 10px 12px; }
    .chat-header-actions { gap: 4px; }
    .chat-header-actions .btn { padding: 6px 10px; font-size: 12px; }
    .messages { padding: 16px 12px; }
    .ai-draft-box { margin: 0 12px 12px; }
    .chat-input { padding: 10px 12px 14px; }
    .chat-input textarea { font-size: 16px; }
    .message { max-width: 85%; }
    .filters { padding: 10px 12px; }
    .filter-btn { padding: 8px 14px; font-size: 13px; }
    .conversation-item { padding: 14px 12px; }
    .conversation-item.attention { padding-left: 9px; }
    .group-head { padding: 12px 12px 6px; }
    .group-head .btn, .conv-actions .btn { padding: 9px 14px; font-size: 13px; }
    .sidebar-header { padding: 14px 12px 12px; }
    .btn { padding: 10px 14px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span>🦎</span> Gekkoriget</div>
  <nav class="nav" id="nav">
    <button data-view="overview" class="active">Overblik</button>
    <button data-view="inbox">Indbakke <span class="pill" id="nav-pill" hidden></span></button>
  </nav>
</header>

<section class="view overview" id="view-overview">
  <div class="ov-inner">
    <div class="tiles">
      <button class="tile attention" onclick="goInbox('attention')">
        <div class="num" id="ov-attention">0</div>
        <div class="label">Kræver dig</div>
        <div class="sub" id="ov-attention-sub"></div>
      </button>
      <button class="tile drafted" onclick="goInbox('drafted')">
        <div class="num" id="ov-drafted">0</div>
        <div class="label">Klar til at sende</div>
        <div class="sub">Svar som AI har skrevet. Tjek dem, eller send dem alle.</div>
      </button>
      <div class="tile static">
        <div class="num" id="ov-today">0</div>
        <div class="label">Sendt i dag</div>
        <div class="split"><span><b id="ov-today-ai">0</b> af AI</span><span><b id="ov-today-you">0</b> af dig</span></div>
      </div>
      <div class="tile static">
        <div class="num" id="ov-open">0</div>
        <div class="label">Åbne samtaler</div>
        <div class="split" id="ov-sources"></div>
      </div>
    </div>

    <div class="card">
      <h2><span>Kræver dig nu</span><a onclick="goInbox('attention')">Åbn indbakke</a></h2>
      <div class="ov-list" id="ov-list"></div>
    </div>

    <div class="card">
      <h2><span>Denne uge</span><span class="note">Svar sendt pr. dag</span></h2>
      <div class="chart" id="chart"></div>
      <div class="legend"><span class="ai">Sendt af AI, godkendt af dig</span><span class="you">Skrevet af dig</span></div>
    </div>
  </div>
</section>

<section class="view" id="view-inbox" hidden>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="hero"><strong id="hero-count">0</strong><span id="hero-label">kræver dig</span></div>
      <div class="hero-sub" id="hero-sub"></div>
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Alle</button>
      <button class="filter-btn" data-filter="attention">Kræver dig <span class="count" id="count-attention"></span></button>
      <button class="filter-btn" data-filter="drafted">Klar til at sende <span class="count" id="count-drafted"></span></button>
      <button class="filter-btn" data-filter="done">Afsluttet <span class="count" id="count-done"></span></button>
    </div>
    <div class="conversation-list" id="conversation-list"></div>
  </div>

  <!-- Main panel -->
  <div class="main" id="main-panel">
    <div class="main-empty" id="empty-state">
      <div class="icon">💬</div>
      <div>Vælg en samtale for at komme i gang</div>
    </div>
  </div>
</div>

</section>

<!-- Toast -->
<div class="toast" id="toast"><span class="check">✓</span> <span id="toast-text">Svar sendt</span></div>

  },
  {
    id: 9, name: "Anders V.", avatar: "A", color: "teal", minutesAgo: 260, source: "messenger",
    status: "attention", unread: true,
    messages: [
      { from: "customer", text: "Min kronegekkos hale virker helt slap og har mistet farve de sidste par dage. Kan det være mangel på kalk?", time: "01.10" },
      { from: "customer", text: "Han spiser stadig, men bevæger sig meget stille.", time: "01.11" },
    ],
    aiDraft: null, holdReason: "health"
  },
  {
    id: 10, name: "Ida M.", avatar: "I", color: "orange", minutesAgo: 310, source: "instagram",
    status: "drafted", unread: false,
    messages: [
      { from: "customer", text: "Hej! Fulgte jer fra Reptilmessen i Rødovre — sælger I stadig kronegekkoer, og hvad koster en unge cirka?", time: "00.05" },
    ],
    aiDraft: "Hej Ida! Ja, vi har kronegekkoer 🦎 Aske vender tilbage med pris og hvilke unger der er tilbage fra kuldet.",
    confidence: 82
  },
];

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function multiline(str) { return esc(str).replace(/\n/g, "<br>"); }

// Sample history for the week chart. Replace with real counts when a channel is wired.
const WEEK = [
  { day: "Ons", ai: 14, you: 5 },
  { day: "Tor", ai: 11, you: 4 },
  { day: "Fre", ai: 18, you: 6 },
  { day: "Lør", ai: 22, you: 3 },
  { day: "Søn", ai: 9, you: 2 },
  { day: "Man", ai: 16, you: 4 },
];
// Seeded from the sample: replies the shop already sent today.
const sentToday = { ai: 0, you: conversations.reduce((n, c) => n + c.messages.filter(m => m.from === "shop").length, 0) };

let view = "overview";
let activeFilter = "all";
let selectedConvId = null;
let confirmBulk = false;

const GROUPS = [
  { key: "attention", label: "Kræver dig", statuses: ["attention"] },
  { key: "drafted", label: "Klar til at sende", statuses: ["drafted"] },
  { key: "done", label: "Afsluttet", statuses: ["resolved", "spam"] },
];

function ago(mins) {
  if (mins < 60) return `${mins}m`;
  if (mins < 1440) return `${Math.round(mins / 60)}t`;
  return `${Math.round(mins / 1440)}d`;
}
const SOURCE_LABEL = { messenger: "Messenger", instagram: "Instagram", email: "E-mail" };
function statusLabel(status) {
  return { attention: "Kræver dig", drafted: "Klar til at sende", resolved: "Afsluttet", spam: "Spam" }[status];
}
function byRecency(a, b) { return a.minutesAgo - b.minutesAgo; }
function inGroup(c, g) { return g.statuses.includes(c.status); }
function drafted() { return conversations.filter(c => c.status === "drafted" && c.aiDraft); }

function updateCounts() {
  const attention = conversations.filter(c => c.status === "attention").length;
  const ready = drafted().length;
  const done = conversations.filter(c => c.status === "resolved" || c.status === "spam").length;
  const hero = document.getElementById("hero-count");
  hero.textContent = attention;
  hero.classList.toggle("zero", attention === 0);
  document.getElementById("hero-label").textContent = "kræver dig";
  document.getElementById("hero-sub").textContent =
    ready ? `${ready} ${ready === 1 ? "svar" : "svar"} klar til at sende. Ét tryk hver, eller send dem alle.` : "Intet venter på at blive sendt.";
  document.getElementById("count-attention").textContent = attention;
  document.getElementById("count-drafted").textContent = ready;
  document.getElementById("count-done").textContent = done;
  const pill = document.getElementById("nav-pill");
  pill.textContent = attention; pill.hidden = attention === 0;
  if (view === "overview") renderOverview();
}

function renderItem(c) {
  const last = c.messages[c.messages.length - 1];
  let preview;
  if (c.status === "drafted" && c.aiDraft) preview = `<div class="conv-preview draft">${esc(c.aiDraft)}</div>`;
  else if (c.status === "attention" && c.holdReason === "health") preview = `<div class="conv-preview flag">Muligt sundhedsproblem</div>`;
  else preview = "";
  const actions = c.status === "drafted" && c.aiDraft
    ? `<div class="conv-actions">
         <button class="btn btn-success" onclick="event.stopPropagation(); sendDraft(${c.id}); afterSend()">Send</button>
         <button class="btn btn-outline" onclick="event.stopPropagation(); selectConversation(${c.id})">Åbn</button>
       </div>`
    : "";
  return `
    <div class="conversation-item ${c.status} ${selectedConvId === c.id ? 'selected' : ''}"
         role="button" tabindex="0"
         onclick="selectConversation(${c.id})"
         onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectConversation(${c.id}); }">
      ${c.unread ? '<div class="unread-dot"></div>' : ''}
      <div class="avatar ${c.color}">${esc(c.avatar)}</div>
      <div class="conv-info">
        <div class="conv-top">
          <span class="conv-name">${esc(c.name)}</span>
          <span class="conv-meta">${esc(SOURCE_LABEL[c.source] || c.source)} · ${ago(c.minutesAgo)}</span>
        </div>
        <div class="conv-preview">${esc(last.from === "shop" ? "Dig: " + last.text : last.text)}</div>
        ${preview}
        ${actions}
      </div>
    </div>`;
}

function renderGroup(g, items) {
  let head = `<span>${g.label} · ${items.length}</span>`;
  if (g.key === "drafted" && items.length > 1) {
    head += confirmBulk
      ? `<span class="bulk">
           <button class="btn btn-success" onclick="sendAllDrafts()">Send ${items.length} nu</button>
           <button class="btn btn-outline" onclick="confirmBulk = false; renderConversationList()">Annullér</button>
         </span>`
      : `<button class="btn btn-outline" onclick="confirmBulk = true; renderConversationList()">Send alle</button>`;
  }
  let body;
  if (items.length) body = items.map(renderItem).join("");
  else if (g.key === "attention") body = `<div class="group-empty"><strong>Ingenting kræver dig.</strong>Gå ud og pas dyrene.</div>`;
  else if (g.key === "drafted") body = `<div class="group-empty">Ingen svar venter.</div>`;
  else body = `<div class="group-empty">Intet afsluttet endnu.</div>`;
  return `<div class="group-head ${g.key}">${head}</div>${body}`;
}

function renderConversationList() {
  const list = document.getElementById("conversation-list");
  const groups = activeFilter === "all" ? GROUPS : GROUPS.filter(g => g.key === activeFilter);
  list.innerHTML = groups.map(g => {
    const items = conversations.filter(c => inGroup(c, g)).sort(byRecency);
    return renderGroup(g, items);
  }).join("");
}

function sendDraft(id, text) {
  const conv = conversations.find(c => c.id === id);
  const body = (text ?? conv.aiDraft ?? "").trim();
  if (!body) return;
  if (body === (conv.aiDraft || "").trim()) sentToday.ai++; else sentToday.you++;
  conv.messages.push({ from: "shop", text: body, time: "Lige nu" });
  conv.aiDraft = null;
  conv.status = "resolved";
  conv.unread = false;
}

function afterSend() {
  showToast("Svar sendt");
  if (selectedConvId) selectConversation(selectedConvId);
  updateCounts();
  renderConversationList();
}

function sendAllDrafts() {
  const ready = drafted();
  ready.forEach(c => sendDraft(c.id));
  confirmBulk = false;
  showToast(`${ready.length} svar sendt`);
  if (selectedConvId) selectConversation(selectedConvId);
  updateCounts();
  renderConversationList();
}

function selectConversation(id) {
  if (view !== "inbox") showView("inbox");
  selectedConvId = id;
  const conv = conversations.find(c => c.id === id);
  conv.unread = false;
  document.body.classList.add("conv-open");
  renderConversationList();
  renderChatPanel(conv);
}

function closeConversation() {
  document.body.classList.remove("conv-open");
  selectedConvId = null;
  renderConversationList();
}

function renderChatPanel(conv) {
  const main = document.getElementById("main-panel");
  const status = `${statusLabel(conv.status)} · ${esc(SOURCE_LABEL[conv.source] || conv.source)}`;

  let messagesHTML = conv.messages.map(m => `
    <div class="message ${m.from === 'shop' ? 'shop' : 'customer'}">
      ${multiline(m.text)}
      <div class="time">${esc(m.time)}</div>
    </div>
  `).join("");

  let aiDraftHTML = "";
  if (conv.aiDraft) {
    aiDraftHTML = `
      <div class="ai-draft-box">
        <div class="ai-draft-header">
          <div class="ai-draft-label"><span class="sparkle">✨</span> AI-forslag</div>
          <span class="ai-confidence">Sikkerhed: ${conv.confidence}%</span>
        </div>
        <div class="ai-draft-text" id="draft-display">${multiline(conv.aiDraft)}</div>
        <textarea class="ai-draft-textarea" id="draft-edit">${esc(conv.aiDraft)}</textarea>
        <div class="ai-draft-actions">
          <button class="btn btn-success" onclick="approveDraft(${conv.id})">✓ Godkend og send</button>
          <button class="btn btn-outline" id="edit-btn" onclick="toggleEdit()">✎ Rediger svar</button>
          <button class="btn btn-outline" onclick="resolveConversation(${conv.id})">Afslut</button>
          <button class="btn btn-danger" onclick="spamConversation(${conv.id})">🚫 Spam</button>
        </div>
      </div>
    `;
  } else if (conv.status === "attention") {
    const note = conv.holdReason === "health"
      ? "Det her ligner et sundhedsproblem, så der er ikke skrevet noget svarforslag. Svar selv nedenfor."
      : "Der er ikke skrevet noget svarforslag til den her. Svar selv nedenfor.";
    aiDraftHTML = `
      <div class="ai-draft-box" style="border-top-color: #ff5252;">
        <div class="ai-draft-header">
          <div class="ai-draft-label" style="color: #d32f2f;"><span class="sparkle">⚠️</span> Kræver dit svar</div>
        </div>
        <div style="font-size: 13px; color: #65676b;">${note}</div>
      </div>
    `;
  }

  main.innerHTML = `
    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-left">
          <button class="btn btn-outline back-btn" onclick="closeConversation()">←</button>
          <div class="avatar ${conv.color}">${esc(conv.avatar)}</div>
          <div>
            <div class="chat-header-name">${esc(conv.name)}</div>
            <div class="chat-header-status">${status}</div>
          </div>
        </div>
        <div class="chat-header-actions">
          ${conv.status === 'resolved' || conv.status === 'spam'
            ? `<button class="btn btn-outline" onclick="reopenConversation(${conv.id})">↩ Genåbn</button>`
            : `<button class="btn btn-outline" onclick="resolveConversation(${conv.id})">✓ Afslut</button>`}
        </div>
      </div>
      <div class="messages">
        <div class="date-divider">I dag</div>
        ${messagesHTML}
      </div>
      ${aiDraftHTML}
      <div class="chat-input">
        <textarea placeholder="Skriv et svar..." rows="1" id="manual-reply"></textarea>
        <button class="btn btn-primary" onclick="sendManualReply(${conv.id})">Send</button>
      </div>
    </div>
  `;
}

function approveDraft(id) {
  const textarea = document.getElementById("draft-edit");
  sendDraft(id, textarea ? textarea.value : undefined);
  afterSend();
}

function toggleEdit() {
  const conv = conversations.find(c => c.id === selectedConvId);
  const box = document.querySelector(".ai-draft-box");
  const display = document.getElementById("draft-display");
  const textarea = document.getElementById("draft-edit");
  const btn = document.getElementById("edit-btn");
  const editing = box.classList.toggle("editing");
  if (editing) {
    btn.textContent = "✓ Færdig";
    btn.classList.add("btn-primary");
    btn.classList.remove("btn-outline");
    textarea.focus();
  } else {
    btn.textContent = "✎ Rediger svar";
    btn.classList.remove("btn-primary");
    btn.classList.add("btn-outline");
    conv.aiDraft = textarea.value;
    display.innerHTML = multiline(textarea.value);
  }
}

function sendManualReply(id) {
  const textarea = document.getElementById("manual-reply");
  const text = textarea.value.trim();
  if (!text) return;
  const conv = conversations.find(c => c.id === id);
  sentToday.you++;
  conv.messages.push({ from: "shop", text: text, time: "Lige nu" });
  if (conv.status === "attention") {
    conv.status = "resolved";
  }
  showToast("Svar sendt");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function resolveConversation(id) {
  const conv = conversations.find(c => c.id === id);
  conv.status = "resolved";
  conv.aiDraft = null;
  showToast("Markeret som afsluttet");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function reopenConversation(id) {
  const conv = conversations.find(c => c.id === id);
  conv.status = "attention";
  showToast("Samtalen genåbnet");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function spamConversation(id) {
  const conv = conversations.find(c => c.id === id);
  conv.status = "spam";
  conv.aiDraft = null;
  showToast("Markeret som spam");
  selectConversation(id);
  updateCounts();
  renderConversationList();
}

function showToast(text) {
  const toast = document.getElementById("toast");
  document.getElementById("toast-text").textContent = text;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}

// Overview
function renderOverview() {
  const attention = conversations.filter(c => c.status === "attention").sort(byRecency);
  const ready = drafted().length;
  const open = conversations.filter(c => c.status === "attention" || c.status === "drafted");
  const tile = document.querySelector(".tile.attention");
  tile.classList.toggle("zero", attention.length === 0);
  document.getElementById("ov-attention").textContent = attention.length;
  document.getElementById("ov-attention-sub").textContent = attention.length
    ? (attention.some(c => c.holdReason === "health") ? "Mindst én ligner et sundhedsproblem." : "Venter på svar fra dig.")
    : "Intet venter på dig.";
  document.getElementById("ov-drafted").textContent = ready;
  document.getElementById("ov-today").textContent = sentToday.ai + sentToday.you;
  document.getElementById("ov-today-ai").textContent = sentToday.ai;
  document.getElementById("ov-today-you").textContent = sentToday.you;
  document.getElementById("ov-open").textContent = open.length;
  const bySource = {};
  open.forEach(c => { bySource[c.source] = (bySource[c.source] || 0) + 1; });
  document.getElementById("ov-sources").innerHTML = Object.entries(bySource)
    .map(([k, n]) => `<span><b>${n}</b> ${esc(SOURCE_LABEL[k] || k)}</span>`).join("") || "<span>Ingen åbne</span>";

  document.getElementById("ov-list").innerHTML = attention.length
    ? attention.map(renderItem).join("")
    : `<div class="ov-empty"><strong>Ingenting kræver dig.</strong>Gå ud og pas dyrene.</div>`;

  const pill = document.getElementById("nav-pill");
  pill.textContent = attention.length;
  pill.hidden = attention.length === 0;

  const days = [...WEEK, { day: "I dag", ai: sentToday.ai, you: sentToday.you, today: true }];
  const max = Math.max(...days.map(d => d.ai + d.you), 1);
  document.getElementById("chart").innerHTML = days.map(d => `
    <div class="col ${d.today ? "today" : ""}" title="${esc(d.day)}: ${d.ai} af AI, ${d.you} af dig">
      <div class="total">${d.ai + d.you || ""}</div>
      <div class="stack">
        <div class="seg ai" style="height:${(d.ai / max) * 100}%"></div>
        <div class="seg you" style="height:${(d.you / max) * 100}%"></div>
      </div>
      <div class="day">${esc(d.day)}</div>
    </div>`).join("");
}

function showView(name) {
  view = name;
  document.getElementById("view-overview").hidden = name !== "overview";
  document.getElementById("view-inbox").hidden = name !== "inbox";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  if (name === "overview") renderOverview();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  renderConversationList();
}

function goInbox(filter) {
  setFilter(filter || "all");
  showView("inbox");
}

document.getElementById("nav").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (btn) showView(btn.dataset.view);
});

// Filters
document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (btn) setFilter(btn.dataset.filter);
});

// Init
updateCounts();
renderConversationList();
showView("overview");
</script>
</body>
</html>
